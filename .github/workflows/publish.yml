name: publish

# Packs every plugin, publishes any version that is new, and rebuilds + signs
# the index.
#
# The job is gated on the `publish` GitHub Environment, which must have required
# reviewers: the signing key lives in that environment, so merging a PR is
# deliberately not enough on its own to produce a signature. A signature proves
# an artifact came from here — it does not say the plugin is safe. Review does
# that, and the client still prompts before trusting a plugin's capabilities.
#
# The generated index is published to the `registry` branch, never to the branch
# holding the sources. That keeps the branch people contribute to free to carry
# real review requirements — required approvals, code-owner review — without CI
# ever needing write access to it or a bypass around it. Nothing is lost by the
# index living on an unreviewed branch: review cannot establish that an index is
# authentic, only the signature can, and clients verify it over the raw bytes
# before parsing them.

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "yanked.json"
  workflow_dispatch:

concurrency:
  # The index carries a serial derived from the published one. Two concurrent
  # runs would read the same previous serial and race to push conflicting
  # successors.
  group: publish-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    env:
      # Branch the generated index is served from. Protect it against force
      # pushes and deletion, but do not require a pull request on it — CI is its
      # only writer.
      REGISTRY_BRANCH: registry
      # Must match the tag and asset names created below.
      URL_TEMPLATE: https://github.com/${{ github.repository }}/releases/download/{id}-v{version}/{id}-{version}.zip
      PUBLISHER_KEY_ID: ${{ vars.PUBLISHER_KEY_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      # Before anything is signed or released. If the previously published index
      # cannot be read, the run must stop here rather than after creating
      # releases it would then fail to index.
      - name: Fetch the published index
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$REGISTRY_BRANCH" >/dev/null; then
            git fetch --depth=1 origin \
              "+refs/heads/$REGISTRY_BRANCH:refs/remotes/origin/$REGISTRY_BRANCH"
            # A branch that exists but carries no index is a broken state, not a
            # first publish; let this fail.
            git show "origin/$REGISTRY_BRANCH:index.json" > "$RUNNER_TEMP/previous-index.json"
            echo "REGISTRY_BRANCH_EXISTS=1" >> "$GITHUB_ENV"
          else
            # `rc`, not `status`: the latter is read-only in zsh, which silently
            # breaks anyone testing this step outside a runner.
            rc=$?
            # `--exit-code` reports 2 for "no matching ref", which is the genuine
            # first publish. Any other status is a real failure — network, auth,
            # wrong repo — and must never be read as "nothing published yet",
            # because that would rebuild the index with serial 1 and lock out
            # every client that has already recorded a higher one.
            if [ "$rc" -ne 2 ]; then
              echo "::error::Could not determine whether $REGISTRY_BRANCH exists (git ls-remote exited $rc)."
              exit "$rc"
            fi
            echo "No $REGISTRY_BRANCH branch yet — this is the first publish."
            echo "REGISTRY_BRANCH_EXISTS=0" >> "$GITHUB_ENV"
          fi

      - name: Install muaz
        run: |
          curl -fsSL https://github.com/shigar-dev/releases-muaz/releases/latest/download/muaz-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Pack every plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in plugins/*/; do
            [ -f "$dir/manifest.yaml" ] || continue
            slug=$(basename "$dir")
            # `-o dist/` keeps muaz's canonical <id>-<version>.zip name, so the
            # asset name is known without parsing the manifest here.
            muaz plugins pack "$dir" -o dist/ --json > "dist/$slug.json"
          done

      - name: Write the signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          umask 077
          printf '%s' "$MINISIGN_SECRET_KEY" | base64 -d > "$RUNNER_TEMP/minisign.key"

      - name: Sign every archive and release new versions
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          for meta in dist/*.json; do
            # An empty registry leaves the glob unexpanded; there is simply
            # nothing to sign, and the index build below still runs.
            [ -e "$meta" ] || continue
            id=$(jq -r .id "$meta")
            version=$(jq -r .version "$meta")
            zip=$(jq -r .output "$meta")
            tag="$id-v$version"

            # Sign before the tag check, not after it. The index build needs a
            # signature for every version it has not indexed yet, and that is not
            # the same set as "has no release": a run that died between `gh
            # release create` and the index commit leaves a tag whose version
            # never reached index.json. Gating the signature on the tag would
            # then wedge every later run on "no .minisig — refusing to index it
            # unsigned", pointing at the wrong cause and inviting someone to
            # delete a release to escape.
            #
            # Re-signing a version that is already indexed is harmless:
            # build-index.mjs keeps the published entry and never reads this
            # file. And because packing is reproducible, a fresh signature over
            # a re-packed archive covers bytes identical to the released ones.
            printf '%s' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$zip"
            # Read the archive back the way a client will, before it ships.
            muaz plugins verify "$zip" --key publisher.pub

            # A published version is immutable. Its archive is already
            # downloadable and recorded in the index by hash; replacing it would
            # break every pin and every recorded checksum.
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already released — leaving the release untouched"
              continue
            fi
            gh release create "$tag" --title "$id v$version" \
              --notes "Published by the registry publish workflow." "$zip"
          done

      - name: Build the index
        run: |
          set -euo pipefail
          # On a first publish this path does not exist, which build-index.mjs
          # reads as "nothing published yet". A previous index that exists but
          # does not parse is fatal there, deliberately.
          PREVIOUS_INDEX="$RUNNER_TEMP/previous-index.json" \
            node scripts/build-index.mjs > index.json.new
          mv index.json.new index.json

      - name: Sign the index
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          printf '%s' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" -m index.json
          shred -u "$RUNNER_TEMP/minisign.key"

      - name: Publish the index to the registry branch
        run: |
          set -euo pipefail
          git config user.name "registry-bot"
          git config user.email "registry-bot@users.noreply.github.com"

          work="$RUNNER_TEMP/registry-branch"
          if [ "$REGISTRY_BRANCH_EXISTS" = "1" ]; then
            git worktree add "$work" -B "$REGISTRY_BRANCH" "origin/$REGISTRY_BRANCH"
          else
            # Orphan: the index shares no history with the sources, and the
            # branch carries nothing but the two published files.
            git worktree add --detach "$work"
            git -C "$work" checkout --orphan "$REGISTRY_BRANCH"
            # An orphan checkout inherits the source branch's index. Dropping it
            # must not be allowed to fail quietly — that would publish the whole
            # source tree onto the registry branch.
            git -C "$work" rm -rqf .
          fi

          cp index.json index.json.minisig "$work/"
          git -C "$work" add index.json index.json.minisig

          # The branch is served directly to clients, so assert what is on it
          # rather than trusting the steps above to have left it clean.
          tracked=$(git -C "$work" ls-files)
          expected=$(printf 'index.json\nindex.json.minisig')
          if [ "$tracked" != "$expected" ]; then
            echo "::error::$REGISTRY_BRANCH would contain unexpected files:"
            echo "$tracked"
            exit 1
          fi

          if git -C "$work" diff --cached --quiet; then
            echo "index unchanged"
            exit 0
          fi
          git -C "$work" commit -m "publish: rebuild index (run $GITHUB_RUN_ID)"
          # A plain push, never --force: the branch history is the record of every
          # index this registry has served, and a rejected non-fast-forward is a
          # signal worth stopping on.
          git -C "$work" push origin "HEAD:$REGISTRY_BRANCH"
